[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "music-analysis"
version = "0.1.0"
description = "楽譜と演奏の分析(採譜・楽譜分析・演奏と楽譜の対比)"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
# 採譜モデル(Kong ら)を使うとき
# audioread は piano_transcription_inference が使うが依存に含まれていない(librosa 1.0 以降は入らない)
transcribe = ["torch", "piano_transcription_inference", "audioread"]
# 演奏分析の図
analysis = ["pandas", "matplotlib"]
# 楽譜の表示(元の楽譜と演奏から書き起こした楽譜の比較)
score = ["music21", "verovio"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
